syntax = "proto3";

package frameservice;

// Interactive frame extraction. The client opens one Session stream per
// video: it uploads the mp4 as VideoChunks, then the server pipelines it
// through decode -> dedup -> downsample. Each Frames batch is sent in
// response to a Next request (including the first) and holds up to `count`
// frames; a batch shorter than `count` means the pipeline drained mid-batch,
// and the response to a Next once it is empty is EndOfFile. The session ends
// with EndOfFile, a Stop request, stream cancellation, or the server-side
// idle timeout. There is no explicit heartbeat: gRPC keepalive covers
// connection liveness, and waiting longer is just not sending Next yet.
service FrameService {
  rpc Session(stream ClientMessage) returns (stream ServerMessage);
}

message ClientMessage {
  oneof msg {
    VideoChunk chunk = 1; // upload, in order; `last` marks the final chunk
    Next next = 2;        // send the next batch of frames
    Stop stop = 3;        // terminate the session
  }
}

message VideoChunk {
  bytes data = 1;
  bool last = 2;
}

message Next {
  uint32 count = 1; // frames wanted in the next batch; 0 is treated as 1
}
message Stop {}

message ServerMessage {
  oneof msg {
    Frames frames = 1;    // a batch of extracted frames
    EndOfFile eof = 2;    // pipeline drained; session terminates
  }
}

message Frames {
  repeated bytes pngs = 1;
  // Presentation time of each frame in the source video, parallel to `pngs`.
  repeated double timestamps_seconds = 2;
}

message EndOfFile {}
